name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the minimum in composer.json; up to the latest stable.
        php: ['8.2', '8.3', '8.4', '8.5']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: panada
          POSTGRES_PASSWORD: panada
          POSTGRES_DB: panada_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: panada
          MARIADB_PASSWORD: panada
          MARIADB_DATABASE: panada_test
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # So the Redis and Memcached cache drivers are tested too.
      redis:
        image: redis:7
        ports: ['6379:6379']
      memcached:
        image: memcached:1.6
        ports: ['11211:11211']

    env:
      PANADA_TEST_PGSQL: host=127.0.0.1;dbname=panada_test;user=panada;password=panada
      PANADA_TEST_MYSQL: host=127.0.0.1;dbname=panada_test;user=panada;password=panada
      PANADA_TEST_REDIS: 127.0.0.1:6379
      PANADA_TEST_MEMCACHED: 127.0.0.1:11211

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, pdo_mysql, pdo_pgsql, pdo_sqlite, gd, sodium, curl, mbstring, redis, memcached, apcu
          ini-values: apc.enable_cli=1
          coverage: none

      - run: composer install --no-interaction --no-progress

      # Known vulnerabilities (and abandoned packages) in dependencies.
      - run: composer audit

      - run: composer test

      - run: composer analyse

      # Code style does not depend on the PHP version, one run is enough.
      - run: composer cs
        if: matrix.php == '8.3'
